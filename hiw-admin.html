<script>
/* hiw-admin.html — หลังร้านรับหิ้ว (เจ้าของร้าน · ภาษาไทย) · ล็อกอินด้วยบัญชีเจ้าของร้าน (shared.js startApp 'admin')
   ข้อมูล: hiw/pub/* (ลูกค้าอ่านได้) · hiw/priv/* (เจ้าของร้านเท่านั้น: ร้านที่ซื้อ ราคาวอน เรท ค่าใช้จ่าย)
   hiw/orders · hiw/track (สถานะที่ลูกค้าเห็น ไม่มีชื่อ/เบอร์) · hiw/requests (ฝากหาของ) */
(function () {
  'use strict';
  var db = firebase.database();
  var STORES = ['Olive Young', 'Daiso', 'Musinsa', 'Coupang', 'อื่นๆ'];
  var CATS = [['skin', '💧', 'สกินแคร์'], ['sun', '☀️', 'กันแดด'], ['mask', '🩹', 'มาสก์ & แผ่นแปะ'], ['clean', '🫧', 'คลีนซิ่ง'], ['makeup', '💄', 'เมกอัพ'], ['nail', '💅', 'เล็บ'], ['body', '🧴', 'บอดี้ & ผม'], ['other', '✨', 'อื่นๆ']];
  var STT = { wait: 'รอซื้อ', got: 'ซื้อแล้ว', arrived: 'ถึงลาว', done: 'ส่งแล้ว', ask: 'หมด · รอลูกค้าเลือก', refund: 'คืนเงิน' };
  var STL = { wait: 'ລໍຖ້າຊື້', got: 'ຊື້ແລ້ວ', arrived: 'ຮອດລາວແລ້ວ', done: 'ສຳເລັດ', ask: 'ໝົດ', refund: 'ຄືນເງິນ' };
  var BAD = ['ຍອດເງິນບໍ່ຕົງ', 'ຮູບສະລິບບໍ່ຊັດ', 'ບໍ່ພົບເງິນເຂົ້າບັນຊີ', 'ສະລິບຊ້ຳກັບອໍເດີອື່ນ'];
  var DEF = { rate: 15.9, buffer: 3, fee: 0, step: 1000, thb: 680, feeThb: 200, feeLite: 100, feeHeavy: 300, heavyMl: 200 };
  var LITE = ['makeup', 'nail'];
  var STORE_URL = location.href.replace(/[^/]*([?#].*)?$/, 'hiw.html');

  var S = { pub: null, priv: null, products: null, meta: null, orders: null, track: {}, reqs: {}, img: {}, ot: 'home', of: 'slip', store: 'all', sub: null, editP: null, applying: {} };

  /* ---------- utils ---------- */
  function $(s) { return document.querySelector(s); }
  function E(s) { return esc(s); }
  function num(v) { var x = parseFloat(String(v == null ? '' : v).replace(/[, ]/g, '')); return isFinite(x) ? x : 0; }
  function fm(v) { return Math.round(v).toLocaleString('en-US'); }
  function kip(v) { return fm(v) + ' ₭'; }
  function won(v) { return '₩' + fm(v); }
  function digits(s) { return String(s || '').replace(/\D/g, ''); }
  function waNum(p) { var d = digits(p); if (!d) return ''; if (d.indexOf('856') === 0) return d; if (d.charAt(0) === '0') d = d.slice(1); return '856' + d; }
  function dmy(s) { var d = new Date(s + 'T00:00:00'); return isNaN(d) ? '-' : d.getDate() + '/' + (d.getMonth() + 1); }
  function dstr(t) { var d = new Date(t || 0); return d.getDate() + '/' + (d.getMonth() + 1) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function say(t, ok) { toast(t, ok); }
  function modal(h) { $('#layer').innerHTML = '<div class="modal" data-a="bg"><div class="sheet">' + h + '</div></div>'; }
  function closeM() { $('#layer').innerHTML = ''; }
  function hash(s) { s = String(s || ''); var h = 5381; for (var i = 0; i < s.length; i += 7) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36) + ':' + s.length; }
  function sets() { return Object.assign({}, DEF, S.priv || {}); }
  function costOf(w, s) { s = s || sets(); return num(w) * num(s.rate) * (1 + num(s.buffer) / 100); }
  // ค่าหิ้วต่อชิ้น (กีบ): บาท × เรทบาท · เมกอัพ/เล็บ = ของเบา · ft: '' อัตโนมัติ, 'l' ของเบา, 'n' ปกติ
  // ปริมาณรวม (ml/g) จากช่องปริมาณ เช่น "50ml × 2" = 100, "30ml + 10ml" = 40 · แผ่น/ชิ้น ไม่นับ
  function sizeTotal(sz) { var t = 0; String(sz || '').replace(/(\d+(?:\.\d+)?)\s*(ml|g)\b(?:\s*[×x*]\s*(\d+))?/gi, function (_, a, u, x) { t += num(a) * (x ? num(x) : 1); return _; }); return t; }
  // ขั้นค่าหิ้ว: l = ของเบา (เมกอัพ/เล็บ), h = ของหนัก (ปริมาณรวม ≥ heavyMl), n = ปกติ · ft บังคับเองได้
  function tier(cat, ft, sz, s) { s = s || sets(); if (ft === 'l' || ft === 'n' || ft === 'h') return ft; if (LITE.indexOf(cat) >= 0) return 'l'; return num(s.heavyMl) > 0 && sizeTotal(sz) >= num(s.heavyMl) ? 'h' : 'n'; }
  function tierBaht(t, s) { s = s || sets(); return num(t === 'l' ? s.feeLite : t === 'h' ? s.feeHeavy : s.feeThb); }
  function isLite(cat, ft) { return tier(cat, ft) === 'l'; }
  function feeOf(w, s, cat, ft, sz) { s = s || sets(); if (!num(w)) return 0; return Math.round(num(s.thb) * tierBaht(tier(cat, ft, sz, s), s) + costOf(w, s) * num(s.fee) / 100); }
  function autoSell(w, s, cat, ft, sz) { s = s || sets(); if (!num(w)) return 0; var r = num(s.step) || 1; return Math.ceil((costOf(w, s) + feeOf(w, s, cat, ft, sz)) / r) * r; }
  function P(id) { var p = S.products && S.products[id]; if (!p) return null; var m = (S.meta && S.meta[id]) || {}; return Object.assign({ id: id, store: m.store || 'อื่นๆ', ft: m.ft || '' }, p, { won: num(m.won) || num(p.won), wonFull: num(m.wonFull) || num(p.wonFull) }); }
  function plist() { return Object.keys(S.products || {}).map(P).filter(Boolean); }
  function catOf(p) { return CATS.some(function (c) { return c[0] === p.cat; }) ? p.cat : 'other'; }
  function catIc(p) { var c = CATS.filter(function (x) { return x[0] === catOf(p); })[0]; return c ? c[1] : '✨'; }
  function img(p) {
    if (!p) return '📦';
    if (p.hasImg && S.img[p.id]) return '<img src="' + E(S.img[p.id]) + '" alt="" loading="lazy">';
    if (p.hasImg && S.img[p.id] === undefined) { S.img[p.id] = null; db.ref('hiw/pub/pimg/' + p.id).once('value').then(function (s) { if (s.val()) { S.img[p.id] = s.val(); schedule(); } }, function (e) { console.warn(e); }); }
    return catIc(p);
  }
  function stores() { var s = STORES.slice(); plist().forEach(function (p) { if (s.indexOf(p.store) < 0) s.splice(s.length - 1, 0, p.store); }); return s; }
  function olist() { return Object.keys(S.orders || {}).map(function (k) { return Object.assign({ id: k }, S.orders[k]); }); }
  function O(id) { return S.orders && S.orders[id] ? Object.assign({ id: id }, S.orders[id]) : null; }
  function items(o) { return Array.isArray(o.items) ? o.items : Object.keys(o.items || {}).map(function (k) { return o.items[k]; }); }
  function live(i) { return i.st !== 'refund'; }
  function sumItems(o, f) { return items(o).filter(f || live).reduce(function (a, i) { return a + num(i.s) * num(i.q); }, 0); }
  // ย่อรูปเป็น JPEG · ถ้าเบราว์เซอร์เปิดรูปจาก blob ไม่ได้ ลองอ่านเป็น dataURL · ถ้ายังไม่ได้และไฟล์เล็กพอ ใช้รูปเดิม
  function compress(file, max, q) {
    function draw(src) {
      return new Promise(function (res, rej) {
        var im = new Image();
        im.onload = function () {
          try {
            var sc = Math.min(1, max / Math.max(im.width || 1, im.height || 1)), c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(im.width * sc)); c.height = Math.max(1, Math.round(im.height * sc));
            var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
            res(c.toDataURL('image/jpeg', q || 0.72));
          } catch (e) { rej(e); }
        };
        im.onerror = function () { rej(new Error('img')); };
        im.src = src;
      });
    }
    function asDataUrl() {
      return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result || '')); }; r.onerror = function () { rej(new Error('read')); }; r.readAsDataURL(file); });
    }
    var u = URL.createObjectURL(file);
    return draw(u).then(function (d) { URL.revokeObjectURL(u); return d; }, function () {
      URL.revokeObjectURL(u);
      return asDataUrl().then(function (raw) {
        return draw(raw).then(null, function () { if (/^data:image\//.test(raw) && raw.length < 350000) return raw; throw new Error('img'); });
      });
    });
  }
  function copy(t, ok) { try { navigator.clipboard.writeText(t).then(function () { say(ok || 'คัดลอกแล้ว ✓'); }, function () { say('คัดลอกไม่ได้ — กดค้างที่ข้อความแทน', false); }); } catch (e) { say('คัดลอกไม่ได้', false); } }
  function run(p, okMsg) { return p.then(function () { if (okMsg) say(okMsg); return true; }, function (e) { say('บันทึกไม่สำเร็จ: ' + ((e && e.code) || 'ลองใหม่'), false); return false; }); }
  var rq = false;
  function schedule() { if (rq) return; rq = true; setTimeout(function () { rq = false; render(); }, 40); }

  /* ---------- writes ---------- */
  // บันทึกออเดอร์ + สถานะที่ลูกค้าเห็นใน hiw/track (ไม่มีชื่อ/เบอร์)
  // เขียนทีละช่อง (ไม่ส่งรูปสลิปซ้ำทุกครั้ง ยกเว้น withSlip)
  function saveOrder(o, extra, withSlip) {
    var id = o.id, up = {};
    Object.keys(o).forEach(function (k) { if (k === 'id' || (k === 'slip' && !withSlip)) return; up['hiw/orders/' + id + '/' + k] = o[k] === undefined ? null : o[k]; });
    if (o.tok) {
      up['hiw/track/' + o.tok + '/pay'] = o.pay;
      up['hiw/track/' + o.tok + '/badWhy'] = o.badWhy || null;
      up['hiw/track/' + o.tok + '/items'] = items(o).map(function (i) { return { n: i.n, q: num(i.q), s: num(i.s), st: i.st }; });
    }
    Object.assign(up, extra || {});
    return db.ref().update(up);
  }
  // ลูกค้าเลือก “รอรอบหน้า / คืนเงิน” หรือส่งสลิปใหม่ในหน้าติดตาม → นำมาใช้กับออเดอร์
  function applyCustomer() {
    if (!S.orders) return;
    Object.keys(S.track).forEach(function (tok) {
      var t = S.track[tok]; if (!t || (!t.req && !t.reslip) || S.applying[tok]) return;
      var o = olist().filter(function (x) { return x.tok === tok; })[0]; if (!o) return;
      S.applying[tok] = 1;
      var its = items(o).map(function (i) { return Object.assign({}, i); }), extra = {}, newSlip = false;
      Object.keys(t.req || {}).forEach(function (k) { var i = its[+k], v = t.req[k]; if (i && i.st === 'ask' && (v === 'refund' || v === 'wait')) { i.st = v; if (v === 'wait') i.next = true; } });
      if (t.req) extra['hiw/track/' + tok + '/req'] = null;
      o.items = its;
      if (typeof t.reslip === 'string' && /^data:image\//.test(t.reslip)) { o.slip = t.reslip; o.pay = 'pend'; o.badWhy = ''; o.reslipAt = Date.now(); newSlip = true; }
      if (t.reslip) extra['hiw/track/' + tok + '/reslip'] = null;
      saveOrder(o, extra, newSlip).then(function () { delete S.applying[tok]; }, function (e) { delete S.applying[tok]; console.warn('apply', e); });
    });
  }

  /* ---------- derived ---------- */
  function need(store) {
    var m = {};
    olist().forEach(function (o) {
      if (o.pay !== 'ok') return;
      items(o).forEach(function (i, k) {
        if (i.st !== 'wait') return;
        var p = P(i.pid) || { id: 'x:' + i.n, name: i.n, store: 'อื่นๆ', won: 0, cat: 'other' };
        if (store && store !== 'all' && p.store !== store) return;
        var g = m[p.id] || (m[p.id] = { p: p, need: 0, who: {}, rows: [] });
        g.need += num(i.q); g.who[o.name] = (g.who[o.name] || 0) + num(i.q); g.rows.push([o.id, k]);
      });
    });
    var st = stores();
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return st.indexOf(a.p.store) - st.indexOf(b.p.store) || b.need - a.need || a.p.name.localeCompare(b.p.name); });
  }
  function needN(store) { return need(store).reduce(function (a, g) { return a + g.need; }, 0); }
  function packList() { return olist().filter(function (o) { return items(o).some(function (i) { return i.st === 'arrived'; }); }).sort(function (a, b) { return a.no - b.no; }); }
  function refundList() { var r = []; olist().forEach(function (o) { items(o).forEach(function (i, k) { if (i.st === 'refund' && !i.refPaid) r.push({ o: o, i: i, k: k, amt: num(i.s) * num(i.q) }); }); }); return r; }
  function reqOpen() { return Object.keys(S.reqs).filter(function (k) { return !S.reqs[k].done; }).length; }
  function pend() { return olist().filter(function (o) { return o.pay === 'pend'; }).sort(function (a, b) { return (a.at || 0) - (b.at || 0); }); }
  function dupOf(o) { var h = o.slip ? hash(o.slip) : ''; return h ? olist().filter(function (x) { return x.id !== o.id && x.slip && hash(x.slip) === h; }) : []; }
  function round() { return (S.pub && S.pub.round) || {}; }

  /* ---------- render ---------- */
  function render() {
    if (!S.pub || !S.priv || !S.products || !S.meta || !S.orders) return;
    applyCustomer();
    var c = { pend: pend().length, ref: refundList().length, pack: packList().length, req: reqOpen() };
    var tabs = [['home', '🏠', 'วันนี้', c.pend + c.ref], ['orders', '📥', 'ออเดอร์', c.pend], ['buy', '🛒', 'ซื้อของ', 0], ['pack', '📦', 'แพ็ก', c.pack], ['more', '☰', 'เพิ่มเติม', c.req]];
    var body = { home: oHome, orders: oOrders, buy: oBuy, pack: oPack, more: oMore }[S.ot](c);
    var r = round();
    var keep = document.activeElement && document.activeElement.id, pos = keep && document.activeElement.selectionStart;
    $('#app').innerHTML = '<div class="ohead"><h1>🧑‍💼 ' + E(S.pub.shop || 'รับหิ้ว') + ' · หลังร้าน<small>' + (r.name ? E(r.name) + ' · ปิดรับ ' + dmy(r.close) + ' · บิน ' + dmy(r.fly) : 'ยังไม่ได้ตั้งรอบหิ้ว') + '</small></h1></div>' +
      '<main>' + body + '</main><nav class="onav">' + tabs.map(function (t) { return '<button class="' + (S.ot === t[0] ? 'on' : '') + '" data-a="ot" data-v="' + t[0] + '"><b>' + t[1] + '</b>' + t[2] + (t[3] ? '<span class="dot">' + t[3] + '</span>' : '') + '</button>'; }).join('') + '</nav>';
    if (keep) { var el = document.getElementById(keep); if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { /* input บางชนิดตั้งตำแหน่งไม่ได้ */ } } }
  }
  function todo(ic, t, sub, n, go, hot) { return '<button class="todo ' + (n ? (hot ? 'hot' : '') : 'zero') + '" data-a="go" data-v="' + go + '"><span class="ic">' + ic + '</span><span class="tx"><b>' + t + '</b><small>' + sub + '</small></span><span class="n">' + (n || '✓') + '</span></button>'; }
  function oHome(c) {
    var sales = olist().filter(function (o) { return o.pay === 'ok'; }).reduce(function (a, o) { return a + sumItems(o); }, 0);
    var byStore = stores().map(function (s) { return [s, needN(s)]; }).filter(function (x) { return x[1]; });
    var bn = needN(), all = c.pend + c.ref + bn + c.pack + c.req, s = S.pub;
    var setup = !s.accNo || !s.wa || !plist().length;
    return (setup ? '<div class="warn">⚙️ ตั้งค่าให้ครบก่อนเปิดร้าน: ' + [!s.accNo ? 'เลขบัญชี/QR' : '', !s.wa ? 'WhatsApp' : '', !plist().length ? 'สินค้า' : ''].filter(Boolean).join(' · ') + ' <button class="mini" data-a="go" data-v="set">ไปตั้งค่า</button></div>' : '') +
      '<div class="stat" style="margin-bottom:12px"><div><span>ออเดอร์ทั้งหมด</span><b>' + olist().length + '</b></div><div><span>ยอดขาย (ยืนยันแล้ว)</span><b>' + kip(sales) + '</b></div></div>' +
      '<div class="sec" style="margin-top:4px"><h2>วันนี้ต้องทำอะไร</h2><span>' + (all ? 'แตะเพื่อทำต่อ' : '') + '</span></div>' +
      (all ? '' : '<div class="allok">🎉 ไม่มีงานค้าง พักได้!</div>') +
      todo('✅', 'ตรวจสลิป', 'ดูสลิปเทียบยอด แล้วกด ✅ หรือ ❌', c.pend, 'orders', 1) +
      todo('💸', 'คืนเงินลูกค้า', 'ลูกค้าเลือกรับเงินคืนแทนของที่หมด', c.ref, 'refund', 1) +
      todo('🛒', 'ต้องซื้อ', byStore.length ? byStore.map(function (x) { return E(x[0]) + ' ' + x[1]; }).join(' · ') : 'ยังไม่มีของต้องซื้อ', bn, 'buy') +
      todo('📦', 'รอแพ็ก / ส่ง', 'ของถึงลาวแล้ว รอส่งให้ลูกค้า', c.pack, 'pack') +
      todo('🙋', 'ฝากหาของ', 'ลูกค้าขอให้หาสินค้าที่ไม่มีในร้าน', c.req, 'req') +
      '<div class="sec"><h2>ทางลัด</h2></div><div class="menu"><button data-a="go" data-v="mkt"><b>📣</b>สร้างโพสต์เปิดรอบ<small>แคปชันลาว พร้อมโพสต์</small></button>' +
      '<button data-a="copystore"><b>🔗</b>ลิงก์หน้าร้าน<small>คัดลอกส่งลูกค้า</small></button></div>';
  }
  function oOrders(c) {
    var F = [['slip', '✅ ตรวจสลิป (' + c.pend + ')'], ['all', 'ทั้งหมด'], ['bad', '❌ ไม่ผ่าน']];
    var L = olist().sort(function (a, b) { return (b.at || 0) - (a.at || 0); });

        break;
      case 'packed': o = O(id); its = items(o).map(function (i) { return Object.assign({}, i); }); its[+b.dataset.k].packed = !its[+b.dataset.k].packed; o.items = its; run(saveOrder(o)); break;
      case 'delivered': o = O(id); o.items = items(o).map(function (i) { return Object.assign({}, i, i.st === 'arrived' ? { st: 'done' } : {}); }); run(saveOrder(o), 'ปิดออเดอร์ #' + o.no + ' ✓'); break;
      case 'refpaid': o = O(id); its = items(o).map(function (i) { return Object.assign({}, i); }); its[+b.dataset.k].refPaid = true; o.items = its; run(saveOrder(o), 'บันทึกคืนเงินแล้ว'); break;
      case 'pedit': mPedit(id ? P(id) : null); break;
      case 'psave': {
        var nm = $('#e_n').value.trim(), w = num($('#e_w').value), wf = num($('#e_wf').value) > w ? num($('#e_wf').value) : 0, ec = $('#e_c').value, eft = $('#e_ft').value || '', sell = num($('#e_p').value) || autoSell(w, null, ec, eft, $('#e_sz').value), x = $('#e_x').value;
        if (!nm || !sell) { say('ใส่ชื่อ และราคาวอน (หรือราคาขาย)', false); return; }
        var pid = S.editP.id || db.ref('hiw/pub/products').push().key, ex = P(pid), u = {};
        u['hiw/pub/products/' + pid] = { name: nm.slice(0, 120), cat: ec, brand: $('#e_br').value.trim().slice(0, 40), size: $('#e_sz').value.trim().slice(0, 60), sell: sell, won: w, wonFull: wf, fee: Math.min(sell, feeOf(w, null, ec, eft, $('#e_sz').value)), best: num($('#e_b').value), isNew: x === 'new', hidden: x === 'hide', hasImg: !!(S.editP.img || (ex && ex.hasImg)) };
        u['hiw/priv/pmeta/' + pid] = { store: $('#e_s').value.trim() || 'อื่นๆ', won: w, wonFull: wf, ft: eft };
        if (S.editP.img) { u['hiw/pub/pimg/' + pid] = S.editP.img; S.img[pid] = S.editP.img; }
        closeM(); run(db.ref().update(u), 'บันทึกแล้ว · ขึ้นหน้าร้านทันที'); break;
      }
      case 'pdel': { var d = {}; d['hiw/pub/products/' + id] = null; d['hiw/priv/pmeta/' + id] = null; d['hiw/pub/pimg/' + id] = null; closeM(); run(db.ref().update(d), 'ลบแล้ว'); break; }
      case 'exadd': { var n = $('#ex_n').value.trim(), am = num($('#ex_a').value); if (!n || !am) { say('ใส่รายการและจำนวนเงิน', false); return; } run(db.ref('hiw/priv/settings/expenses').push({ n: n.slice(0, 80), a: am })); break; }
      case 'exdel': run(db.ref('hiw/priv/settings/expenses/' + id).remove()); break;
      case 'csv': {
        var rows = [['order', 'customer', 'phone', 'product', 'store', 'qty', 'sell_kip', 'won', 'status', 'pay']];
        olist().sort(function (x, y) { return x.no - y.no; }).forEach(function (oo) { items(oo).forEach(function (i) { var p = P(i.pid) || {}; rows.push([oo.no, oo.name, oo.phone, i.n, p.store || '', i.q, num(i.s) * num(i.q), (p.won || 0) * num(i.q), i.st, oo.pay]); }); });
        copy(rows.map(function (r) { return r.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n'), 'คัดลอก CSV แล้ว ✓'); break;
      }
      case 'rosave': run(db.ref('hiw/pub/settings/round').set({ name: $('#ro_n').value.trim().slice(0, 60), close: $('#ro_c').value || '', fly: $('#ro_f').value || '' }), 'บันทึกแล้ว'); break;
      case 'copycap': copy(caption(), 'คัดลอกโพสต์แล้ว ✓'); break;
      case 'reqdone': run(db.ref('hiw/requests/' + id + '/done').set(true)); break;
      case 'reqdel': run(db.ref('hiw/requests/' + id).remove()); break;
      case 'qrdel': run(db.ref('hiw/pub/settings/qr').remove(), 'ลบ QR แล้ว'); break;
      case 'ssave': {
        var up2 = {};
        ['shop', 'tag', 'wa', 'bank', 'accNo', 'accName'].forEach(function (k) { up2['hiw/pub/settings/' + k] = $('#s_' + k).value.trim().slice(0, 120); });
        ['rate', 'buffer', 'fee', 'step', 'thb', 'feeThb', 'feeLite', 'feeHeavy', 'heavyMl'].forEach(function (k) { up2['hiw/priv/settings/' + k] = num($('#s_' + k).value); });
        if (!up2['hiw/priv/settings/rate']) { say('ใส่เรทเงินก่อน', false); return; }
        run(db.ref().update(up2), 'บันทึกแล้ว'); break;
      }
      case 'reprice': {
        s = sets(); var up3 = {}, cnt = 0;
        plist().forEach(function (p) { if (p.won) { var b = 'hiw/pub/products/' + p.id + '/'; up3[b + 'sell'] = autoSell(p.won, s, catOf(p), p.ft, p.size); up3[b + 'fee'] = feeOf(p.won, s, catOf(p), p.ft, p.size); up3[b + 'won'] = p.won; up3[b + 'wonFull'] = p.wonFull > p.won ? p.wonFull : 0; cnt++; } });
        if (!cnt) { say('ไม่มีสินค้าที่ใส่ราคาวอน', false); return; }
        run(db.ref().update(up3), 'คิดราคาใหม่ ' + cnt + ' รายการ ✓'); break;
      }
      case 'backup': copy(JSON.stringify({ at: new Date().toISOString(), pub: { settings: S.pub, products: S.products }, priv: { settings: S.priv, pmeta: S.meta }, orders: S.orders, requests: S.reqs }), 'คัดลอกข้อมูลสำรองแล้ว ✓ วางเก็บในไฟล์'); break;
      case 'logout': logoutApp(); break;
    }
  });

  /* ---------- start ---------- */
  startApp('admin', function () {
    var on = function (path, key, def) {
      db.ref(path).on('value', function (snap) { S[key] = snap.val() || def; schedule(); }, function (er) { $('#app').innerHTML = '<div class="empty"><b>🔒</b>อ่านข้อมูลไม่ได้ (' + E(er && er.code) + ')<br><span class="mut">ตรวจกฎ Firebase ของ hiw/ ตามคู่มือใน PR</span></div>'; });
    };
    on('hiw/pub/settings', 'pub', {}); on('hiw/priv/settings', 'priv', {}); on('hiw/pub/products', 'products', {}); on('hiw/priv/pmeta', 'meta', {});
    on('hiw/orders', 'orders', {}); on('hiw/track', 'track', {}); on('hiw/requests', 'reqs', {});
  });
})();
</script>
