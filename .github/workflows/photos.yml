name: hiw photo finder
on:
  push:
    branches: [hiw-photo-bot]
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm i --no-save sharp@0.33
      - run: node bot/find.mjs
      - run: |
          git config user.name "hiw photo bot"; git config user.email "bot@users.noreply.github.com"
          git add results && git commit -m "photo bot results [skip ci]" && git push || true
