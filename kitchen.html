<!DOCTYPE html>
<html lang="lo" class="auth-wait">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUGUSTX - Kitchen Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow:wght@500;600;700&family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Sans+Lao:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        /* Streetwear (DESIGN.md): navy shell, ruled square tickets, big numbers readable from across the counter */
        :root { --ink: #14284b; --muted: #596377; --line: #d3d7df; --bg: #f2f3f5; --white: #ffffff; --blue: #1b74c8; --amber: #b45309; --amber-bar: #d97706; --amber-bg: #fef3c7; --red: #b42318; --red-bg: #fdecea;
                --display: "Big Shoulders Display", "Barlow Condensed", "Noto Sans Thai", "Arial Narrow", sans-serif; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, button, input, select { font-family: "Barlow", "Noto Sans Thai", "Noto Sans Lao", system-ui, sans-serif; }
        html { height: 100%; }
        body { background: var(--bg); margin: 0; padding: 0; color: var(--ink); height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; touch-action: manipulation; }
        .num { font-variant-numeric: tabular-nums; }
        .kitchen-container { flex: 1; display: flex; flex-direction: column; min-height: 0; }

        .kitchen-header { flex-shrink: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 26px; background: var(--ink); color: #fff; padding: 0 20px; min-height: 72px; }
        .kitchen-header h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 36px; line-height: 1; letter-spacing: 0; color: #fff; white-space: nowrap; }
        .kitchen-header h1 small { font-family: "Barlow", sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .16em; color: #a9b8d4; margin-left: 10px; vertical-align: 7px; }
        .k-count { display: flex; gap: 22px; }
        .k-count div { font-size: 14px; color: #c7d2e6; line-height: 1.1; }
        .k-count b { display: block; font-family: var(--display); font-weight: 800; font-size: 34px; color: #fff; line-height: .95; }
        .k-count .hot b { color: #8ec3f5; }
        .kitchen-tabs { display: flex; margin-left: auto; align-self: stretch; }
        .tab-btn { background: none; border: 0; border-bottom: 5px solid transparent; color: #a9b8d4; font-weight: 700; font-size: 16px; padding: 0 16px; cursor: pointer; min-height: 72px; }
        .tab-btn.active { color: #fff; border-bottom-color: #5aa2ee; }
        .k-clock { font-family: var(--display); font-weight: 800; font-size: 34px; }
        .top-controls { display: flex; align-items: center; gap: 8px; }
        .top-btn { border: 1.5px solid #3a5283; color: #dce4f2; background: none; font-size: 13px; font-weight: 700; padding: 7px 10px; text-decoration: none; white-space: nowrap; }
        .kitchen-header .i18n-sel { border-radius: 0; background: none; border: 1.5px solid #3a5283; color: #dce4f2; }

        .sound-banner, .queue-alert-banner { display: none; flex-shrink: 0; align-items: center; gap: 10px; padding: 9px 20px; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--line); }
        .sound-banner { background: #e3edf8; color: var(--ink); cursor: pointer; }
        .queue-alert-banner { background: var(--amber-bg); color: #7a3e00; justify-content: space-between; }
        .sound-banner.active, .queue-alert-banner.active { display: flex; }
        .queue-alert-banner strong { font-family: var(--display); font-size: 20px; }

        .date-filter-box { display: none; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; padding: 12px 20px 0; flex-shrink: 0; }
        .date-filter-box.active { display: flex; }
        .date-filter-box input { padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 0; font-size: 15px; background: #fff; color: var(--ink); }

        .orders-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); grid-auto-rows: max-content; grid-gap: 16px; gap: 16px; align-content: start; padding: 16px 20px 24px; -webkit-overflow-scrolling: touch; }
        .k-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 80px 20px; font-size: 20px; font-weight: 700; }
        .order-card { position: relative; background: var(--white); border: 1.5px solid var(--line); display: flex; flex-direction: column; min-height: 300px; }
        .order-card::before { content: ""; position: absolute; left: -1.5px; right: -1.5px; top: -1.5px; height: 6px; background: var(--ink); }
        .order-card.warn::before { background: var(--amber-bar); }
        .order-card.late::before, .order-card.cancel::before { background: var(--red); }
        .order-card.cooking { border-color: var(--blue); box-shadow: inset 0 0 0 1.5px var(--blue); }
        .order-card.cancel { border-color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red); }
        .order-card.completed { opacity: .7; }
        .order-card.completed::before { background: var(--line); }

        .order-card-header { display: flex; align-items: flex-start; gap: 12px; padding: 16px 16px 10px; }
        .order-no { border: 1.5px solid var(--ink); font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; padding: 3px 8px 1px; flex: none; }
        .cancel .order-no { border-color: var(--red); color: var(--red); }
        .k-who { flex: 1; min-width: 0; }
        .order-table-badge { display: block; font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .k-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
        .k-tag { font-size: 12.5px; font-weight: 700; padding: 2px 7px; border: 1.5px solid var(--line); color: var(--muted); white-space: nowrap; }
        .k-tag.src { background: var(--ink); border-color: var(--ink); color: #fff; }
        .k-tag.cook { background: var(--blue); border-color: var(--blue); color: #fff; }
        .k-tag.add { border-color: var(--blue); color: var(--blue); }
        .k-tag.cancel { background: var(--red); border-color: var(--red); color: #fff; }
        .k-wait { text-align: right; line-height: 1; flex: none; }
        .k-wait b { display: block; font-family: var(--display); font-weight: 900; font-size: 40px; }
        .k-wait span, .order-time { font-size: 12.5px; font-weight: 700; color: var(--muted); }
        .warn .k-wait b { color: var(--amber); }
        .late .k-wait b { color: var(--red); }

        .order-card-body { flex: 1 0 auto; padding: 0 16px 4px; }
        .order-item-row { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
        .k-q { width: 38px; height: 38px; flex: none; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 900; font-size: 24px; }
        .item-name-qty { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.05; text-transform: uppercase; }
        .k-mods { font-size: 14px; color: var(--muted); margin-top: 3px; }
        .item-note { display: inline-block; margin-top: 5px; background: var(--amber-bg); color: #7a3e00; font-size: 14px; font-weight: 700; padding: 2px 8px; }
        .cancel .item-name-qty { color: var(--red); text-decoration: line-through; }
        .cancel .k-q { background: var(--red); }
        .cancel-note { background: var(--red-bg); color: var(--red); font-weight: 700; font-size: 14px; padding: 6px 10px; margin-bottom: 6px; }

        .order-card-footer { display: flex; gap: 8px; padding: 12px 16px 16px; }
        .footer-btns { display: flex; gap: 8px; flex: 1; }
        .action-btn { flex: 1; min-height: 54px; border: 1.5px solid var(--ink); background: var(--ink); color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; border-radius: 0; }
        .action-btn.cooking { background: var(--blue); border-color: var(--blue); }
        .action-btn.cancel { background: var(--red); border-color: var(--red); }
        .action-btn.completed { background: none; color: var(--muted); border-color: var(--line); cursor: default; }
        .undo-btn { width: 54px; min-height: 54px; flex: none; border: 1.5px solid var(--line); background: #fff; color: var(--muted); cursor: pointer; border-radius: 0; display: flex; align-items: center; justify-content: center; }
        .undo-btn svg { display: block; }

        @media (max-width: 760px) {
            .kitchen-header { padding: 8px 12px; gap: 8px 16px; }
            .kitchen-tabs { margin-left: 0; }
            .tab-btn { min-height: 48px; }
            .k-clock { display: none; }
            .orders-grid { padding: 12px; grid-template-columns: 1fr; }
        }
    </style>
    <link rel="manifest" href="kitchen.webmanifest">
    <meta name="theme-color" content="#14284b">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-kitchen-192.png">
    <!-- ซ่อนหน้าไว้จนกว่าจะล็อกอินผ่าน (shared.js startApp เอาออก) -->
    <style>.auth-wait body > :not(#login-overlay) { visibility: hidden; }</style>
</head>
<body>
    <div class="kitchen-container">
        <div class="kitchen-header">
            <h1>AUGUSTX<small>KITCHEN</small></h1>
            <div class="k-count" id="k-count"></div>
            <div class="kitchen-tabs">
                <button class="tab-btn active" id="tab-main-btn" onclick="switchTab('main')">ต้องทำ</button>
                <button class="tab-btn" id="tab-history-btn" onclick="switchTab('history')">ประวัติ</button>
            </div>
            <div class="k-clock num" id="k-clock"></div>
            <div class="top-controls">
                <a href="cashier.html" class="top-btn">แคชเชียร์</a>
                <a href="admin.html" class="top-btn">แอดมิน</a>
            </div>
        </div>

        <div class="sound-banner" id="sound-banner" onclick="unlockAudio()"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2a5 5 0 0 0-5 5v3l-1.5 3h13L14 10V7a5 5 0 0 0-5-5zM7 15a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>แตะที่ใดก็ได้ 1 ครั้งเพื่อเปิดเสียงแจ้งเตือนออร์เดอร์ใหม่</div>

        <div class="queue-alert-banner" id="queue-alert-banner">
            <span>มีออร์เดอร์รอคิวทั้งหมด <strong id="total-pending-num">0</strong></span>
            <span>แสดง 6 คิวแรก · ทำเสร็จแล้วคิวถัดไปจะขึ้นมาเอง</span>
        </div>

        <div class="date-filter-box" id="date-filter-container">
            <label for="history-date-input">เลือกวันที่</label>
            <input type="date" id="history-date-input" onchange="loadHistory()">
        </div>

        <div class="orders-grid" id="kitchen-orders-container">
            <div class="k-empty">กำลังโหลดออร์เดอร์...</div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        const ACTIVE_DAYS = 7;          // แสดงออร์เดอร์ที่ค้างย้อนหลังกี่วัน
        let currentTab = 'main';
        let activeOrders = [];          // ออร์เดอร์ล่าสุด (ใช้หน้า Main)
        let historyOrders = [];         // ออร์เดอร์ของวันที่เลือก (ใช้หน้า History)
        let historyRef = null;
        let knownIds = null;            // เก็บ id ที่เคยเห็นแล้ว เพื่อรู้ว่าอันไหนใหม่
        let audioCtx = null, audioReady = false, wakeLock = null;

        /* ---------------- เสียง ---------------- */
        // จอล็อกแล้ว iPad จะหยุดเสียงของหน้าเว็บ (suspended / interrupted) และไม่เปิดคืนเอง
        // → ตอนกลับมาที่หน้า หรือก่อนส่งเสียง ให้ลองเปิดเสียงเอง ถ้าเครื่องไม่ยอม ให้ขึ้นแถบ "แตะเพื่อเปิดเสียง" อีกครั้ง
        function soundOn() { return !!audioCtx && audioCtx.state === 'running'; }
        function soundReady() {
            audioReady = true;
            document.getElementById('sound-banner').classList.remove('active');
            document.removeEventListener('click', unlockAudio);
        }
        function askForTap() {
            audioReady = false;
            document.getElementById('sound-banner').classList.add('active');
            document.removeEventListener('click', unlockAudio);
            document.addEventListener('click', unlockAudio, { once: true });
        }
        // iOS 12 (webkitAudioContext) อาจไม่คืน Promise จาก resume()
        function resumeAudio() {
            let p = null;
            try { p = audioCtx.resume(); } catch (e) { }
            if (p && p.then) p.then(function () { if (soundOn()) soundReady(); }, function () { });
        }
        function checkSound() {
            if (!audioReady || !audioCtx || soundOn()) return;
            askForTap();
            resumeAudio();
        }
        function unlockAudio() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC && !audioCtx) audioCtx = new AC();
                if (audioCtx && !soundOn()) resumeAudio();
            } catch (e) { }
            soundReady();
            keepAwake();
        }
        // กันจอดับ (เครื่องที่รองรับ: iPadOS 16.4+, Chrome) · iPad รุ่นเก่าให้ตั้ง Auto-Lock = Never แทน
        function keepAwake() {
            if (wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
            try {
                navigator.wakeLock.request('screen').then(function (l) {
                    wakeLock = l;
                    l.addEventListener('release', function () { wakeLock = null; });
                }, function () { });
            } catch (e) { }
        }
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') { checkSound(); keepAwake(); }
        });
        window.addEventListener('pageshow', checkSound);
        function beep(times) {
            if (!audioCtx) return;
            if (!soundOn()) checkSound();
            for (let i = 0; i < times; i++) {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = 'sine'; o.frequency.value = 880;
                g.gain.value = 0.25;
                o.connect(g); g.connect(audioCtx.destination);
                const t0 = audioCtx.currentTime + i * 0.35;
                o.start(t0); o.stop(t0 + 0.2);
            }
        }
        function speak(text) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                window.speechSynthesis.speak(u);
            }
        }
        function playNewOrderSound() { beep(2); speak('New order received'); }
        function playCancelSound() { beep(4); speak('Order cancelled'); }
        function playReminderSound() { beep(1); speak('Pending orders waiting'); }

        /* ---------------- ช่วยทั่วไป ---------------- */
        function isOpen(o) { return !o.status || o.status === 'pending' || o.status === 'cooking'; }
        function openOrders() { return activeOrders.filter(isOpen).sort((a, b) => ((b.kind === 'cancel') - (a.kind === 'cancel')) || ((a.timestamp || 0) - (b.timestamp || 0))); }

        function switchTab(tabName) {
            currentTab = tabName;
            document.getElementById('tab-main-btn').className = 'tab-btn ' + (tabName === 'main' ? 'active' : '');
            document.getElementById('tab-history-btn').className = 'tab-btn ' + (tabName === 'history' ? 'active' : '');
            const filterBox = document.getElementById('date-filter-container');
            if (tabName === 'history') {
                filterBox.classList.add('active');
                document.getElementById('queue-alert-banner').classList.remove('active');
                if (!document.getElementById('history-date-input').value) {
                    document.getElementById('history-date-input').value = dayKey(Date.now());
                }
                loadHistory();
            } else {
                filterBox.classList.remove('active');
                if (historyRef) { historyRef.off(); historyRef = null; }
                checkQueueAlertVisibility();
                renderOrders();
            }
        }

        function checkQueueAlertVisibility() {
            const total = openOrders().length;
            const banner = document.getElementById('queue-alert-banner');
            if (currentTab === 'main' && total > 6) {
                document.getElementById('total-pending-num').innerText = total;
                banner.classList.add('active');
            } else banner.classList.remove('active');
        }

        /* ---------------- โหลดข้อมูล ---------------- */
        function startListeners() {
            if (!audioReady) document.getElementById('sound-banner').classList.add('active');
            document.addEventListener('click', unlockAudio, { once: true });

            // โหลดเฉพาะออร์เดอร์ย้อนหลัง ACTIVE_DAYS วัน (ไม่ดึงทั้งฐานข้อมูล)
            const since = Date.now() - ACTIVE_DAYS * 86400000;
            database.ref('tickets').orderByChild('timestamp').startAt(since).on('value', snap => {
                activeOrders = [];
                snap.forEach(child => { const o = child.val(); o.id = child.key; activeOrders.push(o); });

                const pendingIds = openOrders().map(o => o.id);
                if (knownIds === null) knownIds = new Set(pendingIds);
                else {
                    const fresh = openOrders().filter(o => !knownIds.has(o.id));
                    pendingIds.forEach(id => knownIds.add(id));
                    if (fresh.some(o => o.kind === 'cancel')) playCancelSound();
                    else if (fresh.length) playNewOrderSound();
                }
                checkQueueAlertVisibility();
                renderOrders();
            });

            // เตือนซ้ำทุก 5 นาที ถ้ายังมีออร์เดอร์ค้าง
            setInterval(() => { if (openOrders().length > 0) playReminderSound(); }, 300000);
            // อัปเดตเวลารอทุก 30 วินาที
            setInterval(() => { checkSound(); if (currentTab === 'main') renderOrders(); }, 30000);
            setInterval(tickClock, 10000);
        }

        function loadHistory() {
            const dateStr = document.getElementById('history-date-input').value;
            if (historyRef) { historyRef.off(); historyRef = null; }
            if (!dateStr) { historyOrders = []; renderOrders(); return; }
            const r = dayRange(dateStr);
            historyRef = database.ref('tickets').orderByChild('timestamp').startAt(r.start).endAt(r.end);
            historyRef.on('value', snap => {
                historyOrders = [];
                snap.forEach(child => { const o = child.val(); o.id = child.key; historyOrders.push(o); });
                renderOrders();
            });
        }

        /* ---------------- แสดงผล ---------------- */
        const SRC_TH = { store: 'หน้าร้าน', online: 'ออนไลน์', grab: 'Grab', foodpanda: 'foodpanda', lineman: 'LINE MAN', robinhood: 'Robinhood', shopeefood: 'ShopeeFood' };
        const TYPE_TH = { 'dine-in': 'ทานที่ร้าน', 'take-away': 'กลับบ้าน', takeaway: 'กลับบ้าน', delivery: 'ส่ง' };
        const UNDO_SVG = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h9a5 5 0 0 1 0 10H8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
        function srcLabel(s) { return SRC_TH[s] || s || SRC_TH.store; }
        function typeLabel(t) { return TYPE_TH[t] || t || ''; }
        function tickClock() { const el = document.getElementById('k-clock'); if (el) el.textContent = timeHHMM(Date.now()); }
        function renderCounts() {
            const el = document.getElementById('k-count'); if (!el) return;
            let h;
            if (currentTab === 'main') {
                const open = openOrders();
                const cook = open.filter(o => o.kind !== 'cancel' && o.status === 'cooking').length;
                const wait = open.filter(o => o.kind !== 'cancel' && o.status !== 'cooking').length;
                h = `<div class="hot"><b class="num">${wait}</b>รอรับ</div><div><b class="num">${cook}</b>กำลังทำ</div>`;
            } else {
                const done = historyOrders.filter(o => o.status === 'completed').length;
                h = `<div><b class="num">${done}</b>เสร็จ</div>`;
            }
            if (el.innerHTML !== h) el.innerHTML = h;
        }

        function renderOrders() {
            const container = document.getElementById('kitchen-orders-container');
            renderCounts(); tickClock();
            let list;
            if (currentTab === 'main') list = openOrders().slice(0, 6);
            else list = historyOrders.filter(o => o.status === 'completed' || o.status === 'canceled').sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            let html = '';
            const now = Date.now();
            list.forEach(order => {
                const status = order.status || 'pending';
                const isCancel = order.kind === 'cancel';
                const main = currentTab === 'main';
                let cardClass = isCancel ? 'cancel' : '', btnText = '', btnClass = '';
                if (main) {
                    if (isCancel) { btnText = 'รับทราบการยกเลิก'; btnClass = 'cancel'; }
                    else if (status === 'cooking') { cardClass = 'cooking'; btnText = 'ทำเสร็จแล้ว ✓'; btnClass = 'cooking'; }
                    else btnText = 'รับออร์เดอร์ · เริ่มทำ';
                } else { cardClass = (isCancel ? 'cancel ' : '') + 'completed'; btnText = order.status === 'canceled' ? 'ยกเลิกแล้ว' : 'เสร็จสิ้น ✓'; btnClass = 'completed'; }

                let mins = 0, waitHtml = '';
                if (main && order.timestamp) {
                    mins = Math.max(0, Math.floor((now - order.timestamp) / 60000));
                    if (!isCancel) cardClass += mins >= 20 ? ' late' : (mins >= 10 ? ' warn' : '');
                    waitHtml = `<div class="k-wait"><b class="num">${mins}</b><span>นาที</span></div>`;
                } else if (order.timestamp) {
                    waitHtml = `<div class="k-wait"><span class="order-time num">${timeHHMM(order.timestamp)}</span></div>`;
                }

                let itemsHtml = '';
                Object.values(order.items || {}).forEach(item => {
                    const details = [item.variant].concat(Object.values(item.modifiers || {}).map(m => m.option)).filter(Boolean).join(' · ');
                    itemsHtml += `<div class="order-item-row"><div class="k-q num">${esc(item.quantity)}</div><div><div class="item-name-qty">${esc(item.name)}</div>${details ? '<div class="k-mods">' + esc(details) + '</div>' : ''}${item.note ? '<div class="item-note">หมายเหตุ: ' + esc(item.note) + '</div>' : ''}</div></div>`;
                });

                let tags = '';
                if (isCancel) tags += '<span class="k-tag cancel">ยกเลิก</span>';
                else if (main && status === 'cooking') tags += '<span class="k-tag cook">กำลังทำ</span>';
                if (order.kind === 'add') tags += '<span class="k-tag add">เพิ่ม รอบ ' + esc(order.round || '') + '</span>';
                tags += '<span class="k-tag' + ((order.source || 'store') !== 'store' ? ' src' : '') + '">' + esc(srcLabel(order.source)) + '</span>';
                if (order.orderType) tags += '<span class="k-tag">' + esc(typeLabel(order.orderType)) + '</span>';

                const noHtml = order.orderNo ? `<div class="order-no num">${esc(order.orderNo)}</div>` : '';
                const noteHtml = isCancel && order.note ? `<div class="cancel-note">เหตุผล: ${esc(order.note)}</div>` : '';
                const undo = (main && status === 'cooking' && !isCancel) ? `<button class="undo-btn" title="ย้อนกลับเป็นรอรับ" aria-label="ย้อนกลับเป็นรอรับ" onclick="revertStatus('${esc(order.id)}')">${UNDO_SVG}</button>` : '';
                const act = main ? `onclick="advanceOrderStatus('${esc(order.id)}', '${esc(status)}', '${isCancel ? 'c' : ''}')"` : 'disabled';

                html += `<div class="order-card ${cardClass}">
                    <div class="order-card-header">${noHtml}<div class="k-who"><span class="order-table-badge">${esc(order.name || 'ลูกค้าทั่วไป')}</span><div class="k-tags">${tags}</div></div>${waitHtml}</div>
                    <div class="order-card-body">${noteHtml}${itemsHtml}</div>
                    <div class="order-card-footer"><div class="footer-btns">${undo}<button class="action-btn ${btnClass}" ${act}>${btnText}</button></div></div>
                </div>`;
            });

            if (list.length === 0) {
                const msg = currentTab === 'main' ? 'ไม่มีออร์เดอร์ค้าง' : 'ไม่พบประวัติออร์เดอร์ในวันที่เลือก';
                container.innerHTML = `<div class="k-empty">${msg}</div>`;
            } else container.innerHTML = html;
        }

        // BUG-10: เปลี่ยนสถานะเฉพาะเมื่อสถานะบนเซิร์ฟเวอร์ยังเป็นอย่างที่จอนี้เห็น
        // (แตะช้า/จอค้าง จะไม่เขียน "กำลังทำ" ทับใบที่ถูกยกเลิกไปแล้ว และไม่เปลี่ยนหน้าติดตามของลูกค้า)
        // ถ้าไม่ตรง ไม่ต้องทำอะไร: จอจะอัปเดตเป็นสถานะจริงเอง
        function moveTicket(orderId, from, to) {
            let moved = false;
            return database.ref('tickets/' + orderId + '/status').transaction(s => {
                const cur = s === null ? 'pending' : s; // ใบเก่าไม่มี status = รอทำ
                moved = cur === from;
                if (!moved) return;
                return to;
            }).then(r => r.committed && moved, e => { console.warn('เปลี่ยนสถานะใบสั่งไม่สำเร็จ', e); return false; });
        }
        function advanceOrderStatus(orderId, currentStatus, isCancelTicket) {
            if (currentStatus === 'completed' || currentStatus === 'void') return;
            if (currentStatus === 'canceled') return;
            const next = (currentStatus === 'pending' && !isCancelTicket) ? 'cooking' : 'completed';
            moveTicket(orderId, currentStatus, next).then(ok => { if (ok && !isCancelTicket) syncTrack(orderId, next); });
        }
        function revertStatus(orderId) {
            moveTicket(orderId, 'cooking', 'pending').then(ok => { if (ok) syncTrack(orderId, 'pending'); });
        }
        // ออร์เดอร์ที่ลูกค้าสั่งออนไลน์: อัปเดตหน้าติดตามของลูกค้า (เริ่มทำ → กำลังทำ, เสร็จ → พร้อมรับ / รอส่ง)
        function syncTrack(orderId, ticketStatus) {
            const t = activeOrders.find(o => o.id === orderId);
            if (!t || !t.trackTok) return;
            const next = ticketStatus === 'cooking' ? 'making' : ticketStatus === 'completed' ? (t.trackDelivery ? 'packed' : 'ready') : 'accepted';
            database.ref('order_track/' + t.trackTok + '/status').transaction(cur => {
                if (cur === null) return next; // ยังไม่มีข้อมูลในเครื่อง: Firebase จะส่งค่าจริงมาให้คิดใหม่
                if (cur === 'delivering' || cur === 'rejected') return;
                if (cur === 'ready' && next !== 'ready') return;
                return next;
            }).catch(() => {});
        }

        startApp('staff', startListeners);
    </script>

if(app||!document.documentElement.requestFullscreen)return;
document.addEventListener('click',function f(){document.removeEventListener('click',f,true);document.documentElement.requestFullscreen().catch(function(){});},true);})();
</script>
